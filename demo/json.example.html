<link href="https://cdn.jsdelivr.net/gh/byuwur/easy-json-viewer@v2.12/json.min.css" rel="stylesheet" />
<link id="byVIEWtheme" href="https://cdn.jsdelivr.net/gh/byuwur/easy-json-viewer@v2.12/json.light.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/gh/byuwur/easy-json-viewer@v2.12/json.min.js"></script>
<div class="video-foreground app-container">
  <div class="container vh-100 d-flex flex-column align-items-center justify-content-center p-0">
    <pre id="byJSONrenderer" class="w-100"></pre>
  </div>
</div>
<script>
  /*
   * Keep fragment-local declarations inside this callback.
   * SPA routes execute in the same document, so top-level const/let bindings
   * remain declared and cause redeclaration errors when a fragment loads again.
   */
  $(() => {
    const renderFetched = async (url, options = {}) => {
      try {
        const response = await fetch(url);
        if (!response.ok) console.warn("Something went wrong", response.statusText);
        byJSONviewer(document.getElementById("byJSONrenderer"), await response.json(), options);
      } catch (error) {
        console.warn("Something went wrong", error);
      }
    };
    renderFetched(`https://raw.githubusercontent.com/byuwur/easy-json-viewer/main/test.json`, { chunkSize: 1, chunkLatency: 10 });
  });
</script>
