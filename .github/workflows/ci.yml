name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check _load.js && node --check _functions.js && node --check _common.js && node --check _init.js && node --check _router.js && node --check _spa.js && node --check _lang.js && node --check _fonts.js
      - run: node --test __tests__/runtime.test.js __tests__/common.test.js __tests__/fragment_scripts.test.js __tests__/parity.test.js __tests__/fonts.test.js
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --test __tests__/browser.test.js __tests__/fonts.browser.test.js __tests__/load.browser.test.js
