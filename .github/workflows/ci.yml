name: CI

on:
  workflow_call:
  push:
    branches-ignore: [main]
    tags-ignore: ["v*"]
  workflow_dispatch:
    inputs:
      extended:
        description: Also run reviewed cross-project parity
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check authored JavaScript
        run: |
          node --check _load.js
          node --check _transitions.js
          node --check _functions.js
          node --check _common.js
          node --check _init.js
          node --check _router.js
          node --check _spa.js
          node --check _lang.js
          node --check _fonts.js
      - name: Test core runtime contracts
        run: node --test __tests__/runtime.test.js __tests__/common.test.js __tests__/fragment_scripts.test.js __tests__/fonts.test.js

  browser:
    name: browser (${{ matrix.browser }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: ${{ matrix.browser }}

  parity:
    needs: browser
    if: github.event_name == 'workflow_dispatch' && inputs.extended && !cancelled()
    name: Reviewed SPA parity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test __tests__/parity.test.js
