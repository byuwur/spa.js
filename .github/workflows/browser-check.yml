name: Browser check

on:
  workflow_call:
    inputs:
      browser:
        type: string
        required: true
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    container:
      # Browser binaries are preinstalled and match the npm package.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 8
    env:
      HOME: /root
      BROWSER_ENGINE: ${{ inputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: spa.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked test tools
        working-directory: spa.js
        run: npm --prefix .github ci --ignore-scripts --no-audit --no-fund
      - name: Run focused checks
        env:
          NODE_PATH: ${{ github.workspace }}/spa.js/.github/node_modules
        working-directory: spa.js
        run: |
          node --test --test-concurrency=1 __tests__/browser.test.js __tests__/load.browser.test.js __tests__/transitions.browser.test.js
